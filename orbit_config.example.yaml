# CR3BP Orbit Continuation Configuration
# ---------------------------------------
# system: "EM" for Earth-Moon, "SE" for Sun-Earth
# preset: Name from presets.py

# NOTE: By default, the package looks to "orbit_config.yaml" for the
# desired configuration. Please create the file using this template.

system: SE
preset: L2_Northern_Halo

# Continuation Parameters
max_iter: 100
eps: 1.0e-10
step: 0.01
max_solutions: 20
max_period_days: .inf

# Output
output_dir: results
show_plots: false
verbose: true

